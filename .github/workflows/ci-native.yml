name: Flask CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize SQLite database
      run: |
        python -c "
        import sqlite3
        conn = sqlite3.connect('todo.sqlite')
        conn.execute('CREATE TABLE IF NOT EXISTS test (id INTEGER PRIMARY KEY, name TEXT)')
        conn.close()
        print('Database initialized')
        "

    - name: Smoke test Flask server
      run: |
        python manage.py runserver &
        SERVER_PID=$!
        sleep 5
        curl -f http://127.0.0.1:5000/ || (echo "Server failed to respond" && kill $SERVER_PID && exit 1)
        kill $SERVER_PID